version: "3.9"

services:
  backend:
    build: .
    container_name: mapple_backend
    command: python3 -m daphne -b 0.0.0.0 -p 8000 mapplebackend.asgi:application
    env_file:
      - .env
    volumes:
      - ./mapplebackend:/app/mapplebackend
    ports:
      - "8000:8000"
    depends_on:
      - db
      - redis

  db:
    image: postgres:15
    container_name: mapple_db
    environment:
      POSTGRES_DB: mapple
      POSTGRES_USER: mapple
      POSTGRES_PASSWORD: mapple123
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: mapple_redis

volumes:
  postgres_data:
